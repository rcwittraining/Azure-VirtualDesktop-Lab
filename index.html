<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azure Virtual Desktop — Interactive Lab</title>
<style>
  :root{
    --blue:#0078d4; --blueD:#005a9e; --ink:#1f1f1f; --mut:#5f6b7a;
    --line:#e1e4e9; --bg:#eef1f5; --ok:#0e9f6e; --err:#c42b1c;
    --mono:'Cascadia Code','Consolas','SFMono-Regular',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  html{overflow-anchor:none}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;overflow-anchor:none}
  button{font-family:inherit}
  .hidden{display:none!important}
  .btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:5px;padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
  .btn:hover{background:var(--blueD)}
  .btn.plain{background:#fff;color:#333;border:1px solid #b6bfca}
  .btn.plain:hover{background:#f4f6f8}
  .btn.small{padding:5px 11px;font-size:12.5px}
  .btn[disabled]{opacity:.45;cursor:default}

  /* hub */
  .hub{max-width:1000px;margin:0 auto;padding:26px 20px 60px}
  .hub-head{text-align:center;margin-bottom:22px}
  .hub-head .hlogo{font-size:44px}
  .hub-head h1{font-size:24px;margin:8px 0 4px}
  .hub-head p{color:var(--mut);margin:0 auto;max-width:640px}
  .modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .modcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .modcard .mi{font-size:34px}
  .modcard .mn{font-weight:700;font-size:15px}
  .modcard .md{font-size:12.5px;color:var(--mut);flex:1}
  .modcard .mstate{font-size:11.5px;font-weight:600;color:var(--mut)}
  .modcard .mstate.ready{color:#0c7a54}
  .modcard .mfoot{margin-top:8px}
  .creds{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:18px}
  .creds h3{margin:0 0 8px;font-size:14px}
  .creds table{width:100%;border-collapse:collapse;font-size:12.8px}
  .creds td{padding:6px 8px;border-bottom:1px solid var(--line)}
  .creds td:first-child{color:var(--mut)}
  .creds code{background:#eef2f7;padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:12px}

  /* module overlays */
  .module{position:fixed;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column}
  .modtop{background:#0b2e4a;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13px}
  .modtop .x{background:transparent;border:0;color:#fff;font-size:16px;cursor:pointer;padding:4px 9px;border-radius:4px;margin-left:auto}
  .modtop .x:hover{background:rgba(255,255,255,.15)}

  /* portal (Azure portal, light theme) */
  .azbody{flex:1;min-height:0;display:flex}
  .aztop{height:48px;background:#fff;border-bottom:1px solid #e6e8ec;display:flex;align-items:center;gap:4px;padding:0 8px;flex:0 0 auto}
  .azicon{width:36px;height:36px;border:0;background:transparent;border-radius:4px;color:#3f4a57;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .azicon:hover{background:#f0f2f5}
  .azicon svg{width:18px;height:18px}
  .azlogo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:#111;white-space:nowrap;padding:0 6px;cursor:pointer}
  .azlogo .ms{width:24px;height:24px;border-radius:4px;background:linear-gradient(135deg,#0078d4,#50b3ff);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .azsearch{flex:1;max-width:560px;margin:0 auto;position:relative}
  .azsearch .box{display:flex;align-items:center;border:1px solid #d0d4da;border-radius:4px;background:#fff}
  .azsearch .box:focus-within{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,120,212,.15)}
  .azsearch input{flex:1;border:0;outline:none;padding:7px 8px;font-size:13px;background:transparent;min-width:0}
  .azsearch .mag{display:flex;align-items:center;padding:0 2px 0 10px;color:#6a7480}
  .azsearch .kbd{border:1px solid #d0d4da;border-radius:3px;font-size:10px;color:#6a7480;padding:1px 5px;margin-right:8px;font-family:var(--mono);white-space:nowrap}
  .azright{display:flex;align-items:center;gap:2px;margin-left:auto}
  .bellrel{position:relative}
  .azbadge{position:absolute;top:4px;right:5px;background:#d13438;color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px;text-align:center;line-height:15px}
  .azdir{display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:12px;color:#333;text-align:left}
  .azdir:hover{background:#f0f2f5}
  .azdir .avatar{width:28px;height:28px;border-radius:50%;background:#3f74ad;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
  .azdir .dirs{font-size:10.5px;color:#6a7480;line-height:1.2}
  .searchdrop{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid #e6e8ec;border-radius:4px;box-shadow:0 12px 32px rgba(0,0,0,.16);z-index:120;overflow:hidden;max-height:70vh;overflow-y:auto}
  .sd-sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#6a7480;padding:10px 16px 3px}
  .sd-row{display:flex;align-items:center;gap:11px;padding:9px 16px;cursor:pointer;font-size:13.5px;color:#1f1f1f}
  .sd-row:hover{background:#f2f6fb}
  .sd-row .sub{font-size:12px;color:#6a7480;margin-left:auto}
  .sd-row svg{width:16px;height:16px;color:#0078d4;flex:0 0 auto}
  /* rail */
  .rail{width:224px;background:#fff;border-right:1px solid #e6e8ec;padding:8px 6px;overflow:auto;overflow-anchor:none;flex:0 0 auto;transition:width .15s}
  .rail.narrow{width:52px}
  .rail-sec{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#8a94a0;padding:10px 12px 3px;white-space:nowrap;overflow:hidden}
  .rail.narrow .rail-sec{visibility:hidden;height:12px}
  .rail-item{display:flex;align-items:center;gap:11px;padding:7px 12px;border-radius:4px;cursor:pointer;font-size:13px;color:#1f1f1f;border-left:3px solid transparent;white-space:nowrap;overflow:hidden}
  .rail-item:hover{background:#f2f6fb}
  .rail-item.active{background:#eef4fb;border-left-color:var(--blue);font-weight:600}
  .rail-item svg{width:17px;height:17px;color:#0078d4;flex:0 0 auto}
  .rail.narrow .rail-item span.lbl{display:none}
  /* main + command bar */
  .pz-main{flex:1;min-width:0;overflow:auto;overflow-anchor:none}
  .cmdb{display:flex;align-items:center;gap:8px;padding:10px 20px;flex-wrap:wrap}
  .cmdb .crumb{font-size:13px;color:#6a7480}
  .cmdb .crumb b{color:#1f1f1f}
  .cmdb .sp{color:#b6bcc4;padding:0 3px}
  .cmdbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid #c8cdd4;background:#fff;color:#1f1f1f;border-radius:4px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
  .cmdbtn:hover{background:#f4f6f8}
  .cmdbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .cmdbtn.primary:hover{background:var(--blueD)}
  .cmdbtn svg{width:14px;height:14px}
  .page{padding:0 20px 40px}
  .ptitle{font-size:22px;font-weight:600;margin:14px 0 2px}
  .psub{font-size:12.5px;color:#6a7480;margin-bottom:14px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .tile{display:flex;align-items:center;gap:12px;border:1px solid #e6e8ec;border-radius:6px;padding:13px 14px;cursor:pointer;background:#fff}
  .tile:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(0,120,212,.12)}
  .tile .tico{width:34px;height:34px;border-radius:6px;background:#eef4fb;color:#0078d4;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .tile .tico svg{width:18px;height:18px}
  .tile .tn{font-weight:600;font-size:13.5px;color:#1f1f1f}
  .tile .ts{font-size:12px;color:#6a7480}
  .ptable{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid #e6e8ec;border-radius:6px;overflow:hidden}
  .ptable th{background:#f7f8fa;color:#4a5563;text-align:left;padding:9px 14px;border-bottom:1px solid #e6e8ec;font-weight:600;font-size:12px}
  .ptable td{padding:9px 14px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
  .ptable tr.hl{cursor:pointer}
  .ptable tr.hl:hover td{background:#f7fafd}
  .ptable td svg{width:15px;height:15px;color:#0078d4;vertical-align:-3px}
  .pill{display:inline-flex;gap:4px;font-size:11.5px;font-weight:600;border-radius:10px;padding:1px 8px}
  .pill.ok{background:#e6f6ef;color:#0c7a54}
  .pfield{margin:14px 0}
  .pfield label{display:block;font-weight:600;font-size:13px;margin-bottom:5px;color:#1f1f1f}
  .pfield input,.pfield select{width:100%;padding:8px 11px;border:1px solid #c8cdd4;border-radius:4px;font-size:13.5px;background:#fff}
  .pfield input[type=text],.pfield input[type=password],.pfield input[type=number]{font-family:var(--mono)}
  .pfield input:focus,.pfield select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,120,212,.15)}
  .pfield .ferr{color:#b4232a;font-size:12px;margin-top:4px;font-weight:600}
  .pfield .ferr svg{width:12px;height:12px;vertical-align:-2px}
  .pfield .fok{color:#0c7a54;font-size:12px;margin-top:4px;font-weight:600}
  .pfield .fok svg{width:12px;height:12px;vertical-align:-2px}
  .qopt{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid #c8cdd4;border-radius:4px;margin:7px 0;cursor:pointer;font-size:13.5px;background:#fff}
  .qopt:hover{border-color:var(--blue)}
  .qopt input{margin:0;accent-color:var(--blue)}
  /* blades */
  .bladerow{display:flex;height:100%;min-height:0}
  .base{flex:1;min-width:0;overflow:auto;overflow-anchor:none}
  .bladeedge{width:40px;background:#eef1f5;border-right:1px solid #e6e8ec;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#4a5b70;flex:0 0 auto}
  .bladeedge:hover{background:#e2e8ef}
  .bladeedge .vert{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;white-space:nowrap;max-height:220px;overflow:hidden;text-overflow:ellipsis}
  .blade{width:560px;max-width:64vw;flex:0 0 auto;background:#fff;border-left:1px solid #e6e8ec;display:flex;flex-direction:column;animation:bslide .16s ease}
  @keyframes bslide{from{transform:translateX(60px);opacity:.4}to{transform:none;opacity:1}}
  .bladehead{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 4px;flex:0 0 auto}
  .bladehead .bt{font-size:18px;font-weight:600;flex:1;min-width:0}
  .bladehead .bx{background:transparent;border:0;color:#6a7480;cursor:pointer;padding:2px 6px;border-radius:4px;flex:0 0 auto}
  .bladehead .bx:hover{background:#f0f2f5}
  .bladehead .bx svg{width:14px;height:14px}
  .btabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid #e6e8ec;flex:0 0 auto;overflow-x:auto}
  .btab{padding:10px 13px;border:0;background:transparent;color:#6a7480;font-weight:600;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .btab.active{color:var(--blueD);border-bottom-color:var(--blue)}
  .bladebody{flex:1;overflow:auto;overflow-anchor:none;padding:16px 20px}
  .bladefoot{display:flex;justify-content:space-between;gap:10px;padding:12px 20px;border-top:1px solid #e6e8ec;background:#fff;flex:0 0 auto}
  .essential{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
  .ess-item .ek{font-size:11.5px;color:#6a7480;margin-bottom:2px}
  .ess-item .ev{font-size:13px;font-weight:600;word-break:break-word}
  .progline{height:10px;background:#e6ecf3;border-radius:6px;overflow:hidden;margin:10px 0}
  .progline>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0078d4,#38b6ff);transition:width .3s}
  .okbox{text-align:center;padding:30px 18px}
  /* notifications */
  .notifpanel{position:absolute;top:48px;right:8px;width:380px;max-width:94vw;max-height:78%;overflow:auto;background:#fff;border:1px solid #e6e8ec;border-radius:6px;box-shadow:0 16px 40px rgba(0,0,0,.18);z-index:130;padding:6px 0}
  .notifpanel h4{margin:0;padding:12px 16px 6px;font-size:13px;color:#333}
  .notif{display:flex;gap:11px;padding:10px 16px;border-bottom:1px solid #f0f2f5;font-size:13px;align-items:flex-start}
  .notif:last-child{border-bottom:0}
  .notif .ni{width:30px;height:30px;border-radius:50%;background:#eef4fb;color:#0078d4;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .notif .ni svg{width:15px;height:15px}
  .notif .nt{font-weight:600}
  .notif .nm{color:#6a7480;font-size:12.5px}
  .notif .nd{color:#9aa3ad;font-size:11px;margin-top:2px}
  /* catalog */
  .catalog{display:flex;flex:1;min-height:0}
  .cat-side{width:230px;border-right:1px solid #e6e8ec;padding:10px 0;overflow:auto;overflow-anchor:none;flex:0 0 auto}
  .cat-item{padding:9px 18px;font-size:13.5px;cursor:pointer;color:#333;border-left:3px solid transparent}
  .cat-item:hover{background:#f2f6fb}
  .cat-item.active{background:#eef4fb;border-left-color:var(--blue);font-weight:600}
  .cat-main{flex:1;overflow:auto;overflow-anchor:none;padding:14px 24px 30px}
  .cat-main .tiles{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  /* all services + favorites (real Azure) */
  .rail .filter{display:flex;align-items:center;gap:8px;margin:4px 10px 8px;border:1px solid #d0d4da;border-radius:4px;padding:6px 9px;background:#fff}
  .rail .filter svg{width:14px;height:14px;color:#6a7480;flex:0 0 auto}
  .rail .filter input{border:0;outline:none;flex:1;font-size:12.5px;background:transparent;min-width:0}
  .rail.narrow .filter{display:none}
  .svc-letter{font-size:12px;font-weight:700;color:#6a7480;padding:14px 16px 4px;border-bottom:1px solid #e6e8ec}
  .svc-row{display:flex;align-items:center;gap:12px;padding:9px 16px;font-size:13.5px;cursor:pointer;color:#1f1f1f}
  .svc-row:hover{background:#f2f6fb}
  .svc-row svg{width:17px;height:17px;color:#0078d4;flex:0 0 auto}
  .svc-row .star{margin-left:auto;color:#c0c6cd;opacity:0;transition:opacity .1s;font-size:15px}
  .svc-row:hover .star{opacity:1}
  .svc-row .star.on{color:#f59e0b;opacity:1}
  .svc-row .tag{margin-left:auto;font-size:10.5px;color:#9aa3ad;border:1px solid #e6e8ec;border-radius:9px;padding:1px 7px}
  .quickactions{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
  .qa{display:flex;align-items:center;gap:9px;border:1px solid #e6e8ec;border-radius:6px;padding:10px 14px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#1f1f1f}
  .qa:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(0,120,212,.12)}
  .qa svg{width:16px;height:16px;color:#0078d4;flex:0 0 auto}
  .navlist{display:flex;gap:8px;flex-wrap:wrap}
  .navlist .qa{font-weight:500;color:#0078d4;background:#f7fafd;border-color:#d5e6f7}

  /* sign in */
  /* sign in */
  .signin-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#f4f6f8}
  .signin{width:360px;max-width:94vw;background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  .signin .logo{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:18px}
  .signin .logo .ms{width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,#0078d4,#38b6ff);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .signin h2{font-size:19px;margin:0 0 14px}
  .signin .pfield{margin:10px 0}

  /* windows */
  .wall{flex:1;position:relative;background:linear-gradient(150deg,#1a6fc4,#0d4f9b 45%,#08386f);overflow:hidden}
  .deskicon{position:absolute;width:86px;text-align:center;color:#fff;cursor:pointer;padding:6px 2px;border:1px solid transparent;border-radius:3px}
  .deskicon:hover{background:rgba(255,255,255,.14)}
  .deskicon .di{font-size:28px;display:block}
  .deskicon .dn{font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .wintask{height:44px;background:#1c1c1c;display:flex;align-items:center;padding:0 8px;flex:0 0 auto;z-index:40}
  .startbtn{background:transparent;border:0;color:#fff;cursor:pointer;padding:6px 12px;border-radius:3px;display:flex;align-items:center;gap:7px;font-size:13.5px}
  .startbtn:hover{background:rgba(255,255,255,.12)}
  .winflag{width:18px;height:18px;display:grid;grid-template-columns:1fr 1fr;gap:1px}
  .winflag i{background:#4cc2ff}
  .tasksearch{background:#333;border:1px solid #555;border-radius:14px;color:#ccc;padding:5px 16px;font-size:12.5px;margin:0 12px}
  .tray{margin-left:auto;display:flex;align-items:center;gap:6px;color:#e0e0e0;font-size:12px}
  .win{position:absolute;background:#fff;border:1px solid #9aa3ad;box-shadow:0 10px 34px rgba(0,0,0,.4);display:flex;flex-direction:column;border-radius:2px;overflow:hidden;left:6%;top:7%;width:88%;height:80%}
  .wintitle{height:32px;background:#fff;display:flex;align-items:center;gap:8px;padding-left:10px;font-size:13px;border-bottom:1px solid #e3e3e3;flex:0 0 auto}
  .winbtns{margin-left:auto;display:flex;height:100%}
  .winbtn{width:38px;height:100%;border:0;background:transparent;font-size:12px;cursor:pointer}
  .winbtn:hover{background:#e5e5e5}
  .winbtn.close:hover{background:#e81123;color:#fff}
  .winbody{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0;background:#fff}
  .winsub{padding:10px 14px;border-bottom:1px solid #e3e3e3;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .winsub .actions{margin-left:auto;display:flex;gap:6px}
  .mmccols{display:flex;flex:1;min-height:0}
  .mmctree{width:250px;border-right:1px solid #e3e3e3;overflow:auto;overflow-anchor:none;padding:4px 2px;background:#fff}
  .mmclist{flex:1;overflow:auto;overflow-anchor:none;background:#fff}
  .tnode{padding:4px 8px 4px 6px;font-size:12.8px;cursor:pointer;white-space:nowrap;border-radius:2px;color:#222}
  .tnode:hover{background:#e8f1fb}
  .tnode.sel{background:#cce8ff}
  .tl1{padding-left:20px}.tl2{padding-left:40px}.tl3{padding-left:58px}
  table.listtbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .listtbl th{background:#f5f5f5;text-align:left;padding:6px 10px;border-bottom:1px solid #e3e3e3;font-weight:600}
  .listtbl td{padding:5px 10px;border-bottom:1px solid #f0f0f0}
  .wizbody{flex:1;overflow:auto;overflow-anchor:none;padding:16px 22px}
  .wizfoot{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid #e3e3e3;background:#f7f7f7;flex:0 0 auto}
  .wizbtn{border:1px solid #a8b2bd;background:#fdfdfd;color:#333;padding:7px 22px;font-size:13px;border-radius:2px;cursor:pointer}
  .wizbtn:hover{background:#eef1f4}
  .wizbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .wizbtn.primary:hover{background:var(--blueD)}
  .ctx{position:fixed;background:#f7f7f7;border:1px solid #c5c5c5;box-shadow:2px 4px 12px rgba(0,0,0,.3);padding:3px 0;z-index:99;min-width:210px;border-radius:2px}
  .ctx .ci{padding:7px 26px 7px 14px;font-size:12.8px;cursor:pointer}
  .ctx .ci:hover{background:#e5f1fb}
  .lock{flex:1;background:linear-gradient(150deg,#0d5bb8,#0a3d80 60%,#062a58);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;min-height:0}
  .ltime{font-size:76px;font-weight:200}

let hubScroll = 0;

const scrollMem = {};
function moduleKey(){

function winTop(){
  let t = window.pageYOffset || 0;
  if(!t && document.documentElement) t = document.documentElement.scrollTop || 0;
  if(!t && document.body) t = document.body.scrollTop || 0;
  return t;
}
function captureScroll(){
  const els = document.querySelectorAll("[data-scroll]");
  for(let i=0;i<els.length;i++){ const el=els[i]; scrollMem[el.getAttribute("data-scroll")] = el.scrollTop; }
}
function restoreScroll(){
  const els = document.querySelectorAll("[data-scroll]");
  for(let i=0;i<els.length;i++){ const el=els[i]; const k=el.getAttribute("data-scroll"); if(scrollMem[k]!=null) el.scrollTop = scrollMem[k]; }
}

function render(){
  const app=document.getElementById("app");
  const wasHub = (state.module==null);
  const wTop = winTop();
  if(wasHub) hubScroll = wTop;
  const wk = moduleKey();
  const changed = wk !== lastModuleKey;
  if(!changed) captureScroll();

  let html="";
  if(state.module==="portal") html=portalHtml();
  else if(state.module==="dc01"||state.module==="adsync01") html= state.web.inSession? sessionHtml(): deviceHtml();
  else if(state.module==="web") html= state.web.inSession? sessionHtml(): webHtml();
  else if(state.module==="storage") html=storageHtml();
  else html=hubHtml();
  app.innerHTML=html;
  app.insertAdjacentHTML("beforeend", guideHtml().replace(/\{\{UNC\}\}/g, esc(UNC)));

  if(changed){
    lastModuleKey = wk;
    for(const k in scrollMem) delete scrollMem[k];
    if(state.module==null){ try{ window.scrollTo(0, hubScroll); }catch(e){} }
    else { try{ window.scrollTo(0,0); }catch(e){} }
  } else {
    /* same module: keep every scroll position exactly as it was — never jump to top */
    restoreScroll();
    try{
      if(document.body) document.body.scrollTop = wTop;
      if(document.documentElement) document.documentElement.scrollTop = wTop;
      window.scrollTo(0, wTop);
    }catch(e){}
  }
}

function doAction(a,arg){
  const w=state.w;
  /* generic */

  if(a==="module"){ if(arg==="dc01"||arg==="adsync01"){ resetDev(arg); } else if(arg==="portal"){ state.p.email=CRED.portal; } state.module=arg; render(); return; }

  if(a==="pclose"){ state.p.blade=null; render(); return; }
  if(a==="pcreate"){ state.p.blade={type:"create", res:arg}; state.p.tab=0; state.p.form[arg]={}; render(); return; }
  if(a==="pcatalog"){ state.p.blade={type:"catalog"}; render(); return; }
  if(a==="pcat"){ state.p.catalog=parseInt(arg,10); render(); return; }
  if(a==="pcatalogpick"){ if(arg==="decoy"){ toast("This service is not part of the lab"); return; } state.p.blade={type:"create", res:arg}; state.p.tab=0; state.p.form[arg]={}; render(); return; }
  if(a==="ptab"){ state.p.tab=parseInt(arg,10); render(); return; }
  if(a==="preview"){ state.p.tab=2; render(); return; }
  if(a==="prail"){ state.p.railCollapsed=!state.p.railCollapsed; render(); return; }
  if(a==="pstar"){ const key=arg; const i=state.p.favs.indexOf(key); if(i>=0) state.p.favs.splice(i,1); else state.p.favs.push(key); render(); return; }

  if(a==="pdelete"){ toast("Delete is disabled in this lab"); return; }
  if(a==="pf"){ const p=arg.split(":"); const res=p[0], id=p.slice(1).join(":"); const el=document.querySelector('[data-action="pf"][data-arg="'+arg+'"]'); let v; if(el){ if(el.type==="checkbox") v=el.checked; else if(el.type==="radio"){ v=el.value; } else v=el.value; } pform(res)[id]=v; return; }
  if(a==="pfradio"){ return; }
  if(a==="pcreate2"){
    const res=arg; const errs=pError(res);
    if(errs.length){ toast(errs[0]); return; }
    const name=pform(res).name;
    if(res==="rg") inv.rg.push({name:name, region:pform(res).region});
    if(res==="vnet") inv.vnet.push({name:name, space:pform(res).space});
    if(res==="vm") inv.vm.push({name:name, size:pform(res).size, pw:pform(res).pw});
    if(res==="storage") inv.storage.push({name:name, perf:pform(res).perf, auth:pform(res).auth});
    if(res==="hostpool"){ const c=parseInt(pform(res).count,10)||2; inv.hostpool.push({name:name, hosts:c, ws:pform(res).ws}); }
    const kind = res==="hostpool" ? "hp" : res;
    state.p.deploy={active:true,step:0,name:"Deployment - "+name,res:kind,resName:name,msg:"Validating parameters…"};
    state.p.blade={type:"deploy"};
    notifyPortal('check','Deployment started','Deployment - '+name);
    render();
    const steps=["Validating parameters…","Creating resource…","Deployment succeeded."];
    let k=0;
    (function tick(){
      if(!state.p.deploy.active) return;
      if(k<steps.length){ state.p.deploy.step=k+1; state.p.deploy.msg=steps[k]; render(); const log=document.getElementById("dlog"); if(log) log.textContent=steps[k]; k++; setTimeout(tick,600); }
      else { notifyPortal('check','Deployment succeeded','Deployment - '+name); }
    })();
    return;
  }
  if(a==="pgotores"){ const p=arg.split(":"); const kind=p[0]; const name=p.slice(1).join(":"); state.p.deploy={active:false,step:0,name:"",res:"",resName:"",msg:""}; state.p.blade={type:"detail", svc:kind, name:name}; render(); return; }
  if(a==="webopen"){ state.module="web"; render(); return; }
  /* windows device */
  if(a==="wconnect"){ w.stage="lock"; render(); return; }
  if(a==="lockbtn"){ w.stage="cred"; w.fail=false; render(); return; }
  if(a==="pwhint"){ winToast("Lab password: "+CRED.pw); return; }
  if(a==="signin"){ const pw=document.getElementById("loginpw"); const v=pw?pw.value:""; if(v===CRED.pw){ w.stage="welcome"; render(); setTimeout(()=>{ w.stage="desktop"; w.app = w.vm==="adsync01"?"entra":"sm"; render(); },900); } else { w.fail=true; render(); } return; }

  if(a==="openapp"){ w.app=arg; render(); return; }
  if(a==="closeapp"){ w.app=null; render(); return; }

  if(a==="featadd"){ w.featAdded=true; render(); return; }
  if(a==="restart"){ render(); return; }
  if(a==="sm-back"){ w.smWiz=Math.max(-1,w.smWiz-1); render(); return; }
  if(a==="sm-next"){ if(w.smWiz===3 && (!w.roleChecked||!w.featAdded)){ winToast("Select Active Directory Domain Services and Add Features"); return; } w.smWiz++; render(); return; }
  if(a==="sm-install"){ w.smWiz++; render(); return; }
  if(a==="sm-close"){ w.smWiz=-1; w.roleInstalled=true; render(); return; }
  if(a==="promote-start"){ w.promoteWiz=0; w.pf={}; render(); return; }
  if(a==="pf"){ return; } /* handled above */
  if(a==="promote-back"){ w.promoteWiz=Math.max(-1,w.promoteWiz-1); render(); return; }
  if(a==="promote-next"){
    if(w.promoteWiz===0 && !norm(w.pf.forest).includes("corp.contoso.com")){ winToast("Root domain name must be corp.contoso.com"); return; }

    w.promoteWiz++; render(); return;
  }
  if(a==="promote-install"){ w.promoteWiz++; render(); setTimeout(()=>{ w.promoteWiz=-1; w.app=null; inv.ad.forest="corp.contoso.com"; winToast("dc01 is now a domain controller for corp.contoso.com"); render(); },1200); return; }
  /* ADUC */
  if(a==="adsel"){ w.adsel=arg; render(); return; }
  if(a==="new-ou"){ w.dlg={kind:"ou", title:"New Object - Organizational Unit", f:{name:"AVD"}}; render(); return; }
  if(a==="new-group"){ w.dlg={kind:"group", title:"New Object - Group", f:{name:"AVD-Users", scope:"Global"}}; render(); return; }
  if(a==="new-user"){ w.dlg={kind:"user", title:"New Object - User", f:{first:"Alex",last:"Varma",sam:"avduser01",upn:"avduser01@corp.contoso.com"}}; render(); return; }
  if(a==="dlgf"){ const el=document.querySelector('[data-action="dlgf"][data-arg="'+arg+'"]'); if(el){ if(el.type==="radio"){ w.dlg.f.enabled=el.value; } else w.dlg.f[arg]=el.value; } return; }
  if(a==="dlgcancel"){ w.dlg=null; render(); return; }
  if(a==="dlg-ou"){ if(norm(w.dlg.f.name).includes("avd")){ inv.ad.ou=true; inv.ad.ouName=w.dlg.f.name; w.dlg=null; render(); winToast("OU created"); } else winToast('Name the OU "AVD"'); return; }
  if(a==="dlg-group"){ if(norm(w.dlg.f.name).includes("avd-users")){ inv.ad.group=true; inv.ad.groupName=w.dlg.f.name; w.dlg=null; render(); winToast("Group created"); } else winToast('Name the group "AVD-Users"'); return; }
  if(a==="dlg-user"){ if(norm(w.dlg.f.sam).includes("avduser01")){ if(inv.ad.users.indexOf("avduser01")<0) inv.ad.users.push("avduser01"); w.dlg=null; render(); winToast("User created"); } else winToast('SamAccountName should be "avduser01"'); return; }
  /* GPMC */
  if(a==="gpmsel"){ w.gpmsel=arg; render(); return; }
  if(a==="new-gpo"){ w.dlg={kind:"gponame", title:"New GPO", f:{name:"FSLogix-Profiles"}}; render(); return; }
  if(a==="dlg-gpo"){ w.gpoCreated=true; w.dlg=null; w.gpmsel="FSLogix-Profiles"; render(); winToast("GPO created and linked to the AVD OU"); return; }
  if(a==="open-gpedit"){ w.app="gpedit"; render(); return; }
  if(a==="gp-open"){ w.dlg={kind:"policy", title:"Policy setting", policy:arg, f:{enabled:"enabled", vhdloc:w.gp.vhdloc||UNC, ptype:w.gp.ptype||"profile", size:w.gp.size||"30000"}}; render(); return; }

function init(){
  state.web.upn=CRED.user;
  document.addEventListener("click",function(e){
    const t=e.target;
    if(state.p && state.p.signedIn && t && t.closest){
      if(!t.closest(".azsearch") && state.p.searchOpen){ state.p.searchOpen=false; const w=document.getElementById("searchdrop-wrap"); if(w) w.innerHTML=""; }
      if(!t.closest(".bellrel") && !t.closest(".notifpanel") && state.p.notifOpen){ state.p.notifOpen=false; render(); return; }
    }
    const el=(t&&t.closest)?t.closest("[data-action]"):null;
    if(!el) return;
    doAction(el.getAttribute("data-action"), el.getAttribute("data-arg"));
  });
  document.addEventListener("input",function(e){
    const t=e.target; if(!t||!t.getAttribute) return;
    const a=t.getAttribute("data-action");
    if(a==="psearch"){ state.p.search=t.value; state.p.searchOpen=true; const w=document.getElementById("searchdrop-wrap"); if(w) w.innerHTML=searchDropHtml(); return; }
    if(a==="pfilter"){ state.p.filter=t.value; state.p.view="allservices"; state.p.blade=null; render(); const el=document.getElementById("svcfilter"); if(el){ el.focus(); const v=el.value; el.value=""; el.value=v; } return; }
    if(a==="pf"){ const arg=t.getAttribute("data-arg"); const p=arg.split(":"); pform(p[0])[p.slice(1).join(":")]=t.value; return; }
    if(a==="dlgf"){ const arg=t.getAttribute("data-arg"); if(t.type==="radio"){ state.w.dlg.f.enabled=t.value; } else state.w.dlg.f[arg]=t.value; return; }
  });
  document.addEventListener("change",function(e){
    const t=e.target; if(!t||!t.getAttribute) return;
    const a=t.getAttribute("data-action");
    if(a==="pf"){ const arg=t.getAttribute("data-arg"); const p=arg.split(":"); const id=p.slice(1).join(":"); const res=p[0];
      if(t.type==="radio"){ pform(res)[id]=t.value; } else if(t.type==="select"){ pform(res)[id]=t.value; } return; }
    if(a==="dlgf"){ const arg=t.getAttribute("data-arg"); if(t.type==="radio"){ state.w.dlg.f.enabled=t.value; } else state.w.dlg.f[arg]=t.value; return; }
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Enter" && e.target && e.target.id==="loginpw"){ doAction("signin"); }
  });
  render();
}
